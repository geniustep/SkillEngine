# ==========================================
# SkillEngine - Production Docker Compose
# Domain: skill.geniura.com
# Integrated with mohcinae infrastructure
# ==========================================

version: '3.8'

services:
  # ==========================================
  # SkillEngine Backend API (NestJS)
  # ==========================================
  skillengine-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skillengine-api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=8000
      - API_VERSION=v1
      - APP_NAME=SkillEngine API
      - APP_URL=https://skill.geniura.com
      # Database
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@skillengine-db:5432/${POSTGRES_DB:-skillengine}?schema=public
      # Redis
      - REDIS_HOST=skillengine-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      # Keycloak (disabled for local auth - uncomment when Keycloak is ready)
      # - KEYCLOAK_URL=${KEYCLOAK_URL:-https://auth.geniura.com}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-skillengine}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-skillengine-api}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      # JWT
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
      # MinIO Storage (shared with mohcinae)
      - STORAGE_PROVIDER=minio
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-admin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minio123456}
      - MINIO_BUCKET=skillengine
      - MINIO_SECURE=false
      - S3_CDN_URL=https://storage.geniura.com
      # Daily.co Video
      - DAILY_API_KEY=${DAILY_API_KEY:-}
      - DAILY_DOMAIN=${DAILY_DOMAIN:-}
      # Pusher Real-time
      - PUSHER_APP_ID=${PUSHER_APP_ID:-}
      - PUSHER_KEY=${PUSHER_KEY:-}
      - PUSHER_SECRET=${PUSHER_SECRET:-}
      - PUSHER_CLUSTER=${PUSHER_CLUSTER:-eu}
      # CORS
      - CORS_ORIGINS=https://skill.geniura.com,https://geniura.com
    depends_on:
      skillengine-db:
        condition: service_healthy
      skillengine-redis:
        condition: service_healthy
    labels:
      # Traefik routing is configured via file provider in /opt/mohcinae/traefik/dynamic/skillengine.yml
      - "traefik.enable=false"
    networks:
      - mohcinae_web
      - mohcinae_backend
      - skillengine-internal
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==========================================
  # SkillEngine Frontend (Next.js)
  # ==========================================
  skillengine-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skillengine-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_NAME=SkillEngine
      - NEXT_PUBLIC_APP_URL=https://skill.geniura.com
      - NEXT_PUBLIC_API_URL=https://skill.geniura.com/api/v1
      - INTERNAL_API_URL=http://skillengine-api:8000/api/v1
      - NEXTAUTH_URL=https://skill.geniura.com
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      # Keycloak SSO (disabled for local auth)
      # - KEYCLOAK_URL=${KEYCLOAK_URL:-https://auth.geniura.com}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-skillengine}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-skillengine-frontend}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
    depends_on:
      - skillengine-api
    labels:
      # Traefik routing is configured via file provider in /opt/mohcinae/traefik/dynamic/skillengine.yml
      - "traefik.enable=false"
    networks:
      - mohcinae_web
      - skillengine-internal
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ==========================================
  # PostgreSQL Database (SkillEngine dedicated)
  # ==========================================
  skillengine-db:
    image: postgres:16-alpine
    container_name: skillengine-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-skillengine}
    volumes:
      - skillengine-postgres-data:/var/lib/postgresql/data
    networks:
      - skillengine-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Redis Cache (SkillEngine dedicated)
  # ==========================================
  skillengine-redis:
    image: redis:7-alpine
    container_name: skillengine-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - skillengine-redis-data:/data
    networks:
      - skillengine-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  # External networks (shared with mohcinae infrastructure)
  mohcinae_web:
    external: true
  mohcinae_backend:
    external: true
  # Internal network for SkillEngine services
  skillengine-internal:
    driver: bridge

volumes:
  skillengine-postgres-data:
    driver: local
  skillengine-redis-data:
    driver: local

