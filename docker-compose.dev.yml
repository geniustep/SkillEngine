# ==========================================
# SkillEngine - Docker Compose (Development)
# Hot-reload enabled
# ==========================================

version: '3.8'

services:
  # ==========================================
  # SkillEngine Development Server
  # ==========================================
  skillengine-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: skillengine-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_APP_NAME=SkillEngine
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=dev-secret-change-in-production
      - KEYCLOAK_URL=${KEYCLOAK_URL:-http://localhost:8080}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-skillengine}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-skillengine-admin}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET:-dev-secret}
    volumes:
      # Mount source code for hot-reload
      - .:/app
      - /app/node_modules
      - /app/.next
    networks:
      - skillengine-dev-network

  # ==========================================
  # Mock API Server (Optional - for testing)
  # ==========================================
  mock-api:
    image: mockoon/cli:latest
    container_name: skillengine-mock-api
    ports:
      - "8000:8000"
    volumes:
      - ./mock-api:/data
    command: --data /data/mockoon.json --port 8000
    networks:
      - skillengine-dev-network
    profiles:
      - mock

networks:
  skillengine-dev-network:
    driver: bridge
