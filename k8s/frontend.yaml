# ==========================================
# SkillEngine Frontend Deployment
# With Autoscaling (HPA)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillengine-frontend
  namespace: skillengine
  labels:
    app: skillengine-frontend
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: skillengine-frontend
  template:
    metadata:
      labels:
        app: skillengine-frontend
        version: v1
    spec:
      containers:
      - name: skillengine-frontend
        image: skillengine-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: skillengine-config
              key: NODE_ENV
        - name: NEXT_PUBLIC_APP_NAME
          valueFrom:
            configMapKeyRef:
              name: skillengine-config
              key: NEXT_PUBLIC_APP_NAME
        - name: NEXT_PUBLIC_APP_URL
          valueFrom:
            configMapKeyRef:
              name: skillengine-config
              key: NEXT_PUBLIC_APP_URL
        - name: NEXT_PUBLIC_API_URL
          valueFrom:
            configMapKeyRef:
              name: skillengine-config
              key: NEXT_PUBLIC_API_URL
        - name: NEXTAUTH_URL
          valueFrom:
            configMapKeyRef:
              name: skillengine-config
              key: NEXTAUTH_URL
        - name: KEYCLOAK_URL
          valueFrom:
            configMapKeyRef:
              name: skillengine-config
              key: KEYCLOAK_URL
        - name: KEYCLOAK_REALM
          valueFrom:
            configMapKeyRef:
              name: skillengine-config
              key: KEYCLOAK_REALM
        - name: NEXTAUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: skillengine-secrets
              key: NEXTAUTH_SECRET
        - name: KEYCLOAK_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: skillengine-secrets
              key: KEYCLOAK_CLIENT_ID
        - name: KEYCLOAK_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: skillengine-secrets
              key: KEYCLOAK_CLIENT_SECRET
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: skillengine-frontend
  namespace: skillengine
spec:
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: skillengine-frontend
  type: ClusterIP
---
# ==========================================
# Horizontal Pod Autoscaler for Frontend
# ==========================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: skillengine-frontend-hpa
  namespace: skillengine
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: skillengine-frontend
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max

