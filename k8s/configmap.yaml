# ==========================================
# SkillEngine ConfigMap
# ==========================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: skillengine-config
  namespace: skillengine
data:
  # Application
  NODE_ENV: "production"
  PORT: "8000"
  API_VERSION: "v1"
  APP_NAME: "SkillEngine API"
  APP_URL: "https://skill.geniura.com"
  
  # Database
  DB_HOST: "skillengine-db"
  DB_PORT: "5432"
  DB_NAME: "skillengine"
  
  # Redis
  REDIS_HOST: "skillengine-redis"
  REDIS_PORT: "6379"
  
  # Keycloak
  KEYCLOAK_URL: "https://auth.geniura.com"
  KEYCLOAK_REALM: "skillengine"
  
  # MinIO
  MINIO_ENDPOINT: "minio:9000"
  MINIO_BUCKET: "skillengine"
  MINIO_SECURE: "false"
  S3_CDN_URL: "https://storage.geniura.com"
  
  # JWT
  JWT_EXPIRES_IN: "15m"
  JWT_REFRESH_EXPIRES_IN: "7d"
  
  # CORS
  CORS_ORIGINS: "https://skill.geniura.com,https://geniura.com"
  
  # Frontend
  NEXT_PUBLIC_APP_NAME: "SkillEngine"
  NEXT_PUBLIC_APP_URL: "https://skill.geniura.com"
  NEXT_PUBLIC_API_URL: "https://skill.geniura.com/api/v1"
  NEXTAUTH_URL: "https://skill.geniura.com"

