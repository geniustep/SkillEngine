# ==========================================
# SkillEngine Kustomization
# ==========================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: skillengine

resources:
  - namespace.yaml
  - configmap.yaml
  - database.yaml
  - redis.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml
  - middleware.yaml

commonLabels:
  app.kubernetes.io/name: skillengine
  app.kubernetes.io/part-of: geniura-platform
  app.kubernetes.io/managed-by: kustomize

images:
  - name: skillengine-api
    newTag: latest
  - name: skillengine-frontend
    newTag: latest

