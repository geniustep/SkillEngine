# ==========================================
# SkillEngine Redis Cache
# ==========================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: skillengine-redis-pvc
  namespace: skillengine
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: do-block-storage
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillengine-redis
  namespace: skillengine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skillengine-redis
  template:
    metadata:
      labels:
        app: skillengine-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: redis
        command:
        - redis-server
        - --appendonly
        - "yes"
        volumeMounts:
        - name: redis-data
          mountPath: /data
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "250m"
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: skillengine-redis-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: skillengine-redis
  namespace: skillengine
spec:
  ports:
  - port: 6379
    targetPort: 6379
    protocol: TCP
    name: redis
  selector:
    app: skillengine-redis
  type: ClusterIP

