# ==========================================
# SkillEngine Traefik Middlewares
# ==========================================
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: skillengine-https-redirect
  namespace: skillengine
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: skillengine-rate-limit
  namespace: skillengine
spec:
  rateLimit:
    average: 100
    burst: 200
    period: 1m
---
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: skillengine-api-rate-limit
  namespace: skillengine
spec:
  rateLimit:
    average: 50
    burst: 100
    period: 1m
---
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: skillengine-security-headers
  namespace: skillengine
spec:
  headers:
    frameDeny: true
    contentTypeNosniff: true
    browserXssFilter: true
    referrerPolicy: "strict-origin-when-cross-origin"
    customResponseHeaders:
      X-Content-Type-Options: "nosniff"
      X-Frame-Options: "DENY"
      X-XSS-Protection: "1; mode=block"
---
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: skillengine-compress
  namespace: skillengine
spec:
  compress: {}

